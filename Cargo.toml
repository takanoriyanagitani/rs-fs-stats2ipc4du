[package]
name = "rs-fs-stats2ipc4du"
version = "0.1.0"
edition = "2024"

exclude = [
]

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "fs-stats2ipc4du"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[dependencies.protobuf]
version = "3.7.2"
default-features = false
features = [
]

[dependencies.arrow-array]
version = "60.0"
default-features = false
features = [
]

[dependencies.arrow-schema]
version = "60.0"
default-features = false
features = [
]

[dependencies.arrow-ipc]
version = "60.0"
default-features = false
features = [
]

[features]
ipc-zstd = [
  "arrow-ipc/zstd",
]
